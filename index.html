<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login & Audio Streaming Player</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f5f5f5;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }

        .container {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 300px;
        }

        input {
            padding: 10px;
            width: 90%;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
        }

        button {
            padding: 10px 20px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 10px;
        }

        button:hover {
            background-color: #0056b3;
        }

        audio {
            margin-top: 20px;
            width: 100%;
        }

        .hidden {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container" id="loginContainer">
        <h2>Login</h2>
        <input type="email" id="email" placeholder="Email" required />
        <input type="password" id="password" placeholder="Password" required />
        <button onclick="login()">Login</button>
    </div>

    <div class="container hidden" id="audioContainer">
        <h2>Audio Streaming Player</h2>
        <p>Masukkan <strong>Audio ID</strong> dan klik "Play Audio" untuk memulai streaming:</p>
        <input type="number" id="audioId" placeholder="Masukkan Audio ID..." required />
        <button onclick="playAudio()">Play Audio</button>

        <audio id="audioPlayer" controls style="display: none;">
            <source id="audioSource" src="" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
    </div>

    <script>
        async function login() {
            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            if (!email || !password) {
                alert("Email dan password harus diisi!");
                return;
            }

            try {
                const res = await fetch("http://localhost:3000/api/users/login", {
                    method: "POST",
                    headers: {
                        'Content-Type': "application/json",
                    },
                    body: JSON.stringify({email, password})
                });

                if (!res.ok) {
                    const errorData = await res.json();
                    alert(`Login gagal: ${errorData.message || 'Periksa kembali email dan password Anda'}`);
                    return;
                }

                const data = await res.json();
                alert("Login sukses");

                document.getElementById("loginContainer").classList.add("hidden");
                document.getElementById("audioContainer").classList.remove("hidden");

                console.log("Login berhasil, data pengguna:", data);
            } catch (error) {
                console.error("Terjadi kesalahan saat login:", error);
                alert("Login gagal: Terjadi kesalahan pada server.");
            }
        }

        function playAudio() {
            const audioId = document.getElementById("audioId").value;
            if (!audioId) {
                alert("Masukkan Audio ID!");
                return;
            }

            const audioPlayer = document.getElementById("audioPlayer");
            const audioSource = document.getElementById("audioSource");

            // Assuming backend API is hosted on localhost:3000, adjust if necessary
            audioSource.src = `http://localhost:3000/api/audios/play/${audioId}`;
            audioPlayer.style.display = "block"; // Show audio player
            audioPlayer.load(); // Reload source
            audioPlayer.play(); // Start playing
        }
    </script>

</body>

</html>
